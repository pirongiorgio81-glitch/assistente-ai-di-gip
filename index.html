<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NVIDIA AI Assistant</title>
    <style>
        /* Reset e stili di base */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100dvh; /* dvh gestisce meglio la barra degli indirizzi mobile */
            overflow: hidden;
        }

        /* Intestazione */
        header {
            background-color: #1a1a1a;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-weight: bold;
            color: #76b900; /* Verde NVIDIA */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            z-index: 10;
        }

        /* Area dei messaggi */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            word-wrap: break-word;
            font-size: 15px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background-color: #2b5278;
            border-bottom-right-radius: 4px;
            color: #e0e0e0;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #2a2a2a;
            border-bottom-left-radius: 4px;
            border: 1px solid #333;
            color: #e0e0e0;
        }

        .bot-message.loading {
            color: #888;
            font-style: italic;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Animazione puntini di caricamento */
        .dot {
            width: 4px;
            height: 4px;
            background-color: #888;
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 1; }
        }

        /* Area di input */
        #input-area {
            background-color: #1a1a1a;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 20px;
            padding: 12px 15px;
            resize: none;
            font-size: 15px;
            outline: none;
            height: 48px;
            max-height: 120px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #76b900;
        }

        button {
            background-color: #76b900;
            color: #000;
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(118, 185, 0, 0.2);
        }

        button:active {
            background-color: #5a8f00;
            transform: scale(0.95);
        }

        button:disabled {
            background-color: #333;
            color: #666;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Icona invio */
        .send-icon {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-left: -2px; /* Piccolo aggiustamento visivo */
        }
    </style>
</head>
<body>

    <header>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#76b900"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
        NVIDIA AI Assistant
    </header>

    <div id="chat-container">
        <div class="message bot-message">
            Ciao! Sono il tuo assistente AI basato su NVIDIA. Come posso aiutarti oggi?
        </div>
    </div>

    <div id="input-area">
        <textarea id="user-input" placeholder="Scrivi un messaggio..." rows="1"></textarea>
        <button id="send-btn" disabled>
            <svg class="send-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </div>

    <script>
        // ==========================================
        // CONFIGURAZIONE - MODIFICA QUESTA RIGA!
        // ==========================================
        // Incolla qui la tua API Key completa (deve iniziare con "nvapi-")
        const API_KEY = "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"; 
        
        // Endpoint diretto di NVIDIA (ora funziona grazie a GitHub Pages!)
        const API_URL = "https://integrate.api.nvidia.com/v1/chat/completions";
        const MODEL_NAME = "meta/llama-3.1-8b-instruct"; 
        // ==========================================

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // Array per mantenere la memoria della conversazione
        let messagesHistory = [
            { role: "system", content: "Sei un assistente AI utile e amichevole. Rispondi sempre in italiano in modo chiaro e conciso." }
        ];

        // Abilita/disabilita il pulsante di invio in base al testo
        userInput.addEventListener('input', () => {
            sendBtn.disabled = userInput.value.trim() === '';
            // Auto-resize della textarea
            userInput.style.height = '48px';
            userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
        });

        // Invia con il tasto Invio (a capo con Shift+Invio)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                inviaMessaggio();
            }
        });

        sendBtn.addEventListener('click', inviaMessaggio);

        // Funzione principale per inviare il messaggio
        async function inviaMessaggio() {
            const testo = userInput.value.trim();
            if (!testo) return;

            // Controllo API Key
            if (API_KEY === "INSERISCI_QUI_LA_TUA_API_KEY" || API_KEY.trim() === "") {
                aggiungiMessaggio("Errore: Devi inserire la tua API Key di NVIDIA nel codice sorgente (su GitHub o su Acode).", "bot");
                return;
            }

            // 1. Aggiungi messaggio utente alla UI
            aggiungiMessaggio(testo, "user");
            messagesHistory.push({ role: "user", content: testo });

            // 2. Pulisci input e disabilita
            userInput.value = '';
            userInput.style.height = '48px';
            sendBtn.disabled = true;

            // 3. Aggiungi indicatore di caricamento
            const loadingId = aggiungiMessaggio("", "bot", true);

            try {
                // 4. Chiamata API a NVIDIA (ora diretta, senza proxy!)
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${API_KEY}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        model: MODEL_NAME,
                        messages: messagesHistory,
                        temperature: 0.7,
                        max_tokens: 1024,
                        top_p: 1.0,
                        stream: false
                    })
                });

                if (!response.ok) {
                    let errorMsg = `Errore HTTP: ${response.status}`;
                    try {
                        const errorData = await response.json();
                        if (errorData.detail) errorMsg = errorData.detail;
                    } catch(e) {}
                    throw new Error(errorMsg);
                }

                const data = await response.json();
                const rispostaBot = data.choices[0].message.content;

                // 5. Rimuovi il caricamento e aggiungi la risposta
                rimuoviMessaggio(loadingId);
                aggiungiMessaggio(rispostaBot, "bot");
                messagesHistory.push({ role: "assistant", content: rispostaBot });

            } catch (error) {
                console.error("Errore:", error);
                rimuoviMessaggio(loadingId);
                aggiungiMessaggio(`Si è verificato un errore: ${error.message}. Assicurati che la tua API Key sia corretta e che il credito non sia esaurito.`, "bot");
            } finally {
                // Riabilita l'input
                sendBtn.disabled = userInput.value.trim() === '';
                userInput.focus();
            }
        }

        // Funzione per aggiungere un messaggio alla UI
        function aggiungiMessaggio(testo, tipo, isTemp = false) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', `${tipo}-message`);
            
            if (isTemp) {
                msgDiv.classList.add('loading');
                msgDiv.id = 'loading-msg';
                msgDiv.innerHTML = 'Sto pensando <div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            } else {
                // Sostituisci gli a capo con <br> per visualizzarli in HTML e gestisci il markdown basilare
                msgDiv.innerHTML = testo.replace(/\n/g, '<br>');
            }
            
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight; // Scrolla in fondo
            
            return msgDiv.id || null;
        }

        // Funzione per rimuovere il messaggio di caricamento
        function rimuoviMessaggio(id) {
            if (!id) return;
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
